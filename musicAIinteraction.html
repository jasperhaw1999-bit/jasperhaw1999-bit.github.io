<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lyria Flow Studio</title>
    <style>
        /* Imported Nunito to match the rounded, friendly aesthetic of the mockup */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap');

        body { 
            font-family: 'Nunito', sans-serif; 
            background-color: #F3F0F8; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .studio-container {
            background: #FFFFFF;
            width: 100%;
            max-width: 700px;
            height: 85vh;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid #E8E2F0;
            margin-bottom: 20px;
        }

        .header svg {
            width: 24px;
            height: 24px;
            fill: #7D52B8;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
            color: #7D52B8;
            font-weight: 700;
        }

        #chatContainer {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 20px;
        }

        .message {
            padding: 16px 20px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 15px;
            line-height: 1.5;
        }

        .system-msg {
            background-color: #F8F6FA;
            color: #4A4458;
            align-self: flex-start;
            border: 1px solid #E8E2F0;
        }

        .user-msg {
            background-color: #7D52B8;
            color: #FFFFFF;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 12px;
            background: #FFFFFF;
            padding: 12px;
            border: 1px solid #E8E2F0;
            border-radius: 30px;
            align-items: center;
        }

        .input-area input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 15px;
            padding: 8px 12px;
            background: transparent;
            font-family: inherit;
        }

        .input-area button {
            background: #7D52B8;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            font-style: italic;
            color: #888;
        }

        audio {
            margin-top: 12px;
            width: 100%;
            height: 40px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="studio-container">
        <div class="header">
            <svg viewBox="0 0 24 24">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
            <h2>Lyria Flow Studio</h2>
        </div>

        <div id="chatContainer">
            <div class="message system-msg">
                Welcome to the studio. Describe the vibe you want, or hum a melody to get started.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="promptInput" placeholder="Describe the arrangement..." />
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6KotfNZ7t_-" + "v0kH6km0uumNoTRzspIPkvvgHmtHwbVOPg";
        
        const chatContainer = document.getElementById('chatContainer');
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');

        let previousInteractionId = null;

        function addMessage(text, isUser = false) {
            const bubble = document.createElement('div');
            bubble.className = isUser ? 'message user-msg' : 'message system-msg';
            bubble.textContent = text;
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return bubble;
        }

        // Deep search function to find the audio payload no matter where it is nested
        function extractAudioFromJSON(obj) {
            let audioURL = null;
            
            function search(node) {
                if (audioURL) return; 
                if (node && typeof node === 'object') {
                    // Looks for raw Base64 data
                    if ((node.mimeType || node.mime_type) && node.data) {
                        const mime = node.mimeType || node.mime_type;
                        if (mime.includes('audio')) {
                            audioURL = `data:${mime};base64,${node.data}`;
                            return;
                        }
                    }
                    // Looks for a hosted Google Cloud URI link
                    if (node.fileUri || node.file_uri) {
                        audioURL = node.fileUri || node.file_uri;
                        return;
                    }
                    // Recursively check all nested properties
                    for (let key in node) {
                        search(node[key]);
                    }
                }
            }
            
            search(obj);
            return audioURL;
        }

        sendBtn.addEventListener('click', async () => {
            const text = promptInput.value.trim();
            if (!text) return;
            
            promptInput.value = '';
            addMessage(text, true);
            sendBtn.disabled = true;

            const loadingBubble = addMessage("Generating audio... (This usually takes 15-30 seconds)", false);
            loadingBubble.classList.add('loading');

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/interactions?key=${GEMINI_API_KEY}`;
                
                const payload = {
                    model: "lyria-3-clip-preview",
                    input: text
                };

                if (previousInteractionId) {
                    payload.previous_interaction_id = previousInteractionId;
                }

                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                loadingBubble.remove();

                if (response.ok) {
                    if (data.id) previousInteractionId = data.id;

                    const resultBubble = document.createElement('div');
                    resultBubble.className = 'message system-msg';
                    
                    const audioSource = extractAudioFromJSON(data);

                    if (audioSource) {
                        resultBubble.textContent = "Here is your generated arrangement:";
                        const player = document.createElement('audio');
                        player.controls = true;
                        player.src = audioSource;
                        resultBubble.appendChild(player);
                    } else {
                        // If parsing still fails, prints the raw JSON API output so we can see the exact error
                        resultBubble.textContent = "Audio data could not be found. Raw API response:\n\n" + JSON.stringify(data, null, 2);
                        resultBubble.style.whiteSpace = "pre-wrap";
                        resultBubble.style.fontFamily = "monospace";
                        resultBubble.style.fontSize = "13px";
                    }

                    chatContainer.appendChild(resultBubble);

                } else {
                    addMessage(`API Error: ${data.error?.message || "Unknown error"}`);
                    console.error("API Error", data);
                }

            } catch (error) {
                loadingBubble.remove();
                addMessage("Network error communicating with the Interactions API.");
                console.error(error);
            }
            
            sendBtn.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendBtn.click();
            }
        });
    </script>
</body>
</html>
