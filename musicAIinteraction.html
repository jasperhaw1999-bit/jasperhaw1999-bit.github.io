<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyria Music Generator</title>
  <style>
    :root {
      /* Light purple theme palette */
      --bg-color: #f4ecf9;
      --card-bg: #ffffff;
      --primary: #9b72cf;
      --primary-hover: #835ab5;
      --accent: #d3a4ed;
      --text-main: #4a3363;
      --text-muted: #7b6691;
      --border: #e2d4ef;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(155, 114, 207, 0.15);
      width: 100%;
      max-width: 550px;
    }

    h1 {
      margin-top: 0;
      font-size: 1.75rem;
      color: var(--primary);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .input-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    input[type="password"], textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    button {
      flex: 1;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: translateY(1px);
    }

    button.recording {
      background-color: #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.8; }
      100% { opacity: 1; }
    }

    canvas {
      width: 100%;
      height: 80px;
      background-color: var(--bg-color);
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
    }

    audio {
      width: 100%;
      margin-top: 1rem;
      display: none;
    }

    .status {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      min-height: 1.2rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Lyria Audio Studio</h1>
    
    <div class="input-group">
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="Paste your API key here..." autocomplete="off">
    </div>

    <div class="input-group">
      <label for="prompt">Creative Prompt</label>
      <textarea id="prompt" rows="3" placeholder="e.g., A lo-fi hip hop beat with a smooth saxophone melody..."></textarea>
    </div>

    <label>Hum a melody (Optional)</label>
    <div class="controls">
      <button id="recordBtn">🎤 Start Humming</button>
      <button id="generateBtn">✨ Generate Track</button>
    </div>

    <canvas id="visualizer"></canvas>
    <audio id="audioPlayer" controls></audio>
    <div class="status" id="statusText">Ready</div>
  </div>

  <script>
    const recordBtn = document.getElementById('recordBtn');
    const generateBtn = document.getElementById('generateBtn');
    const visualizer = document.getElementById('visualizer');
    const statusText = document.getElementById('statusText');
    const audioPlayer = document.getElementById('audioPlayer');
    const canvasCtx = visualizer.getContext('2d');

    let mediaRecorder;
    let audioChunks = [];
    let base64Audio = null;
    let audioContext, analyser, dataArray;
    let animationId;

    // --- Microphone & Waveform Logic ---
    recordBtn.addEventListener('click', async () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Audio context for visualizer
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 2048;
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);

        visualizer.style.display = 'block';
        visualizer.width = visualizer.offsetWidth;
        
        function draw() {
          if (mediaRecorder.state !== 'recording') return;
          animationId = requestAnimationFrame(draw);
          
          analyser.getByteTimeDomainData(dataArray);
          
          canvasCtx.fillStyle = '#f4ecf9';
          canvasCtx.fillRect(0, 0, visualizer.width, visualizer.height);
          
          canvasCtx.lineWidth = 2;
          canvasCtx.strokeStyle = '#9b72cf';
          canvasCtx.beginPath();
          
          const sliceWidth = visualizer.width * 1.0 / bufferLength;
          let x = 0;
          
          for (let i = 0; i < bufferLength; i++) {
            const v = dataArray[i] / 128.0;
            const y = v * (visualizer.height / 2);
            if (i === 0) canvasCtx.moveTo(x, y);
            else canvasCtx.lineTo(x, y);
            x += sliceWidth;
          }
          canvasCtx.lineTo(visualizer.width, visualizer.height / 2);
          canvasCtx.stroke();
        }

        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        
        mediaRecorder.onstop = () => {
          recordBtn.textContent = '🎤 Re-record Humming';
          recordBtn.classList.remove('recording');
          cancelAnimationFrame(animationId);
          stream.getTracks().forEach(track => track.stop());
          
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(audioBlob);
          reader.onloadend = () => {
            base64Audio = reader.result.split(',')[1];
            statusText.textContent = 'Humming captured and ready.';
          };
        };

        mediaRecorder.start();
        recordBtn.textContent = '⏹ Stop Recording';
        recordBtn.classList.add('recording');
        statusText.textContent = 'Recording...';
        draw();

      } catch (err) {
        statusText.textContent = 'Microphone access denied.';
        console.error(err);
      }
    });

    // --- Lyria API Submission Logic ---
    generateBtn.addEventListener('click', async () => {
      const apiKey = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('prompt').value.trim();

      if (!apiKey) return statusText.textContent = 'Please paste your Gemini API key.';
      if (!prompt) return statusText.textContent = 'Please enter a creative prompt.';

      generateBtn.disabled = true;
      generateBtn.textContent = '⏳ Generating...';
      statusText.textContent = 'Sending request to Lyria 3.5...';
      audioPlayer.style.display = 'none';

      // Assemble multimodal payload
      const contents = [{
        parts: [{ text: prompt }]
      }];

      if (base64Audio) {
        contents[0].parts.push({
          inlineData: {
            mimeType: 'audio/webm',
            data: base64Audio
          }
        });
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/lyria-3.5:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: contents,
            generationConfig: {
              responseMimeType: "audio/mp3" // Requesting audio output format
            }
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'API request failed');
        }

        // Extract base64 audio from the response structure
        const generatedAudio = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
        
        if (generatedAudio) {
          audioPlayer.src = `data:audio/mp3;base64,${generatedAudio}`;
          audioPlayer.style.display = 'block';
          statusText.textContent = 'Track generated successfully!';
        } else {
          throw new Error('No audio returned in the response.');
        }

      } catch (err) {
        statusText.textContent = `Error: ${err.message}`;
        console.error(err);
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = '✨ Generate Track';
      }
    });
  </script>
</body>
</html>
