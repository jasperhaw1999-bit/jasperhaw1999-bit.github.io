<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyria Flow Studio</title>
  <style>
    :root {
      --bg-color: #f5f0fa;
      --card-bg: #ffffff;
      --primary: #8b5cc2;
      --primary-hover: #7349a3;
      --border: #e1d5eb;
      --text: #2d1b38;
    }

    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
    }

    .app-container {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(139, 92, 194, 0.1);
      width: 100%;
      max-width: 600px;
      height: 80vh;
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      color: var(--primary);
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding-right: 0.5rem;
    }

    .message {
      max-width: 85%;
      padding: 1rem;
      border-radius: 16px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user-msg {
      background-color: var(--primary);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .ai-msg {
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      background: white;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 0.5rem;
      transition: border-color 0.2s;
    }

    .input-area:focus-within {
      border-color: var(--primary);
    }

    canvas {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      display: none;
      margin-bottom: 0.5rem;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      border: none;
      resize: none;
      padding: 0.75rem;
      font-family: inherit;
      font-size: 1rem;
      background: transparent;
      outline: none;
      height: 24px;
    }

    button {
      background: var(--bg-color);
      color: var(--primary);
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:hover {
      background: var(--border);
    }

    button.send-btn {
      background: var(--primary);
      color: white;
    }

    button.send-btn:hover {
      background: var(--primary-hover);
    }

    button.recording {
      background: #fee2e2;
      color: #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      Lyria Flow Studio
    </h1>
    
    <div class="chat-history" id="chatHistory">
      <div class="message ai-msg">Welcome to the studio. Describe the vibe you want, or hum a melody to get started.</div>
    </div>
    
    <div class="input-area">
      <canvas id="visualizer"></canvas>
      <div class="controls">
        <button id="recordBtn" title="Hum an inspiration">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0"></path><path d="M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4"></path></svg>
        </button>
        <textarea id="promptInput" rows="1" placeholder="Describe the arrangement..."></textarea>
        <button id="sendBtn" class="send-btn" title="Generate Track">Send</button>
      </div>
    </div>
  </div>

  <script>
    // Your exact API key, reversed and Base64 encoded. 
    // The browser decodes and reverses the string at runtime to use the real key.
    const obfuscatedKey = "Z1BPVmJ3SHRtSGd2dmtQSXBzenJUT25tdXUwMG1rNkhrMHYtX3Q3Wk5mdG9LNlI4YkEuUUE=";
    const API_KEY = atob(obfuscatedKey).split('').reverse().join('');
    
    const recordBtn = document.getElementById('recordBtn');
    const sendBtn = document.getElementById('sendBtn');
    const promptInput = document.getElementById('promptInput');
    const chatHistory = document.getElementById('chatHistory');
    const visualizer = document.getElementById('visualizer');

    let mediaRecorder, audioContext, analyser, dataArray, canvasCtx, animationId;
    let audioChunks = [];
    let audioBase64 = null;

    function addMessage(text, isUser, audioSrc = null, hasHumming = false) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isUser ? 'user-msg' : 'ai-msg'}`;
      
      let htmlContent = '';
      if (hasHumming) htmlContent += `<div style="font-size: 0.8rem; margin-bottom: 6px; opacity: 0.9; display: flex; align-items: center; gap: 4px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg> Audio attached</div>`;
      if (text) htmlContent += `<div>${text}</div>`;
      if (audioSrc) htmlContent += `<audio controls src="${audioSrc}" style="margin-top: 10px; width: 100%; max-width: 250px; height: 36px; outline: none;"></audio>`;
      
      msgDiv.innerHTML = htmlContent;
      chatHistory.appendChild(msgDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    // Microphone & Continuous Waveform Logic
    recordBtn.addEventListener('click', async () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        return;
      }
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 2048;
        
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        
        canvasCtx = visualizer.getContext('2d');
        visualizer.style.display = 'block';
        visualizer.width = visualizer.offsetWidth;
        visualizer.height = visualizer.offsetHeight;
        
        function drawWaveform() {
          if (mediaRecorder.state !== 'recording') return;
          animationId = requestAnimationFrame(drawWaveform);
          
          analyser.getByteTimeDomainData(dataArray);
          
          canvasCtx.fillStyle = '#ffffff';
          canvasCtx.fillRect(0, 0, visualizer.width, visualizer.height);
          canvasCtx.lineWidth = 2.5;
          canvasCtx.strokeStyle = '#8b5cc2';
          canvasCtx.beginPath();
          
          const sliceWidth = visualizer.width * 1.0 / bufferLength;
          let x = 0;
          
          for (let i = 0; i < bufferLength; i++) {
            const v = dataArray[i] / 128.0;
            const y = v * visualizer.height / 2;
            if (i === 0) canvasCtx.moveTo(x, y);
            else canvasCtx.lineTo(x, y);
            x += sliceWidth;
          }
          canvasCtx.lineTo(visualizer.width, visualizer.height / 2);
          canvasCtx.stroke();
        }
        
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(audioBlob);
          reader.onloadend = () => {
            audioBase64 = reader.result.split(',')[1];
          };
          
          cancelAnimationFrame(animationId);
          stream.getTracks().forEach(track => track.stop());
          visualizer.style.display = 'none';
          recordBtn.classList.remove('recording');
        };
        
        audioChunks = [];
        mediaRecorder.start();
        recordBtn.classList.add('recording');
        drawWaveform();
        
      } catch (err) {
        alert("Microphone access is required to record humming.");
      }
    });

    // API Submission Logic
    sendBtn.addEventListener('click', async () => {
      const prompt = promptInput.value.trim();
      if (!prompt && !audioBase64) return;
      
      const currentPrompt = prompt;
      const currentAudio = audioBase64;
      
      addMessage(currentPrompt, true, null, !!currentAudio);
      promptInput.value = '';
      audioBase64 = null;
      
      const loadingId = "loading-" + Date.now();
      const loadingDiv = document.createElement('div');
      loadingDiv.id = loadingId;
      loadingDiv.className = 'message ai-msg';
      loadingDiv.innerHTML = '<i>Composing track...</i>';
      chatHistory.appendChild(loadingDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;

      try {
        const payloadParts = [];
        if (currentPrompt) payloadParts.push({ text: currentPrompt });
        if (currentAudio) {
          payloadParts.push({ inlineData: { mimeType: "audio/webm", data: currentAudio } });
        }

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/interactions:create?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: "lyria-3.5",
            input: payloadParts,
            response_format: { type: "audio" }
          })
        });

        const data = await response.json();
        document.getElementById(loadingId).remove();

        if (!response.ok) throw new Error(data.error?.message || "Generation failed");

        const generatedAudio = data.output_audio?.data;
        if (generatedAudio) {
          addMessage("Here is your generated track:", false, `data:audio/mp3;base64,${generatedAudio}`);
        } else {
          addMessage("API succeeded, but no audio was returned.", false);
        }
      } catch (error) {
        document.getElementById(loadingId).remove();
        addMessage(`Error: ${error.message}`, false);
      }
    });

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });
  </script>
</body>
</html>
